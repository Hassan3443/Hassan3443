<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90"><style>.big{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#38bdf8}.lab{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#8b949e}
.n{animation:up 1s ease-out both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}</style>
